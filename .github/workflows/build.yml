name: nightly

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      NAME: Youtube Extension
      TAG: yt
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 17
          cache: 'gradle'

      - name: Cook Env
        run: |
          echo -e "## ${{ env.NAME }}\n${{ github.event.head_commit.message }}" > commit.txt
          version=$( echo ${{ github.sha }} | cut -c1-7 )
          echo "VERSION=v$version" >> $GITHUB_ENV
          echo "APP_PATH=app/build/${{ env.TAG }}-$version.eapk" >> $GITHUB_ENV
          echo "${{ secrets.KEYSTORE_B64 }}" | tr -d '\r' | base64 -d > $GITHUB_WORKSPACE/signing-key.jks
          chmod +x ./gradlew

      - name: Build with Gradle
        env:
          KEYSTORE_FILE: ${{ github.workspace }}/signing-key.jks
          KEYSTORE_PASS: ${{ secrets.PASSWORD }}
          RAW_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          ALIAS=$(echo -n "$RAW_ALIAS" | tr -d '\r\n ')
          [ -z "$ALIAS" ] && ALIAS="key0"
          PASS=$(echo -n "$KEYSTORE_PASS" | tr -d '\r\n')
          ./gradlew assembleRelease -Pandroid.injected.signing.store.file="$KEYSTORE_FILE" -Pandroid.injected.signing.store.password="$PASS" -Pandroid.injected.signing.key.alias="$ALIAS" -Pandroid.injected.signing.key.password="$PASS"
          mkdir -p app/build
          cp app/build/outputs/apk/release/app-release.apk ${{ env.APP_PATH }}
          cp app/build/outputs/apk/release/app-release.apk app/build/${{ env.TAG }}-${{ env.VERSION }}.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.TAG }}-${{ env.VERSION }}
          path: |
            ${{ env.APP_PATH }}
            app/build/${{ env.TAG }}-${{ env.VERSION }}.apk

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          make_latest: true
          tag_name: ${{ env.VERSION }}
          body_path: commit.txt
          name: ${{ env.NAME }} ${{ env.VERSION }}
          files: |
            ${{ env.APP_PATH }}
            app/build/${{ env.TAG }}-${{ env.VERSION }}.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Delete Old Releases
        uses: sgpublic/delete-release-action@master
        if: always()
        with:
          release-drop: false
          release-keep-count: 5
          release-drop-tag: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload APK to Discord
        if: env.WEBHOOK != ''
        shell: bash
        env:
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          commit=$(jq -Rsa . <<< "${{ github.event.head_commit.message }}"  | tail -c +2 | head -c -2)
          message=$(echo "@everyone **${{ env.VERSION }}**\n$commit")
          curl -F "payload_json={\"content\":\"${message}\"}" \
          -F "file=@${{ env.APP_PATH }}" \
          ${{ env.WEBHOOK }}

      - name: Upload APK to Telegram
        if: env.BOT_ID != '' && env.CHANNEL_ID != ''
        shell: bash
        env:
          BOT_ID: ${{ secrets.TELEGRAM_BOT_ID }}
          CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          THREAD_ID: ${{ secrets.TELEGRAM_THREAD_ID }}
        run: |
          message=$(echo -e "${{ env.NAME }}\n$(echo -e "${{ github.event.head_commit.message }}" | sed 's/[~>|.!+-=#]/\\&/g')")
          curl -F "chat_id=${{ env.CHANNEL_ID }}" \
          -F "message_thread_id=${{ env.THREAD_ID }}" \
          -F "document=@${{ env.APP_PATH }}" \
          -F "caption=${message}" \
          -F "parse_mode=MarkdownV2" \
          https://api.telegram.org/bot${{ env.BOT_ID }}/sendDocument
